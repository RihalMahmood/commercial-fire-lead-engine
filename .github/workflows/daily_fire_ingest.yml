name: California Fire Safety Autonomous 24h Engine

on:
  schedule:
    # Run every day at 6:00 AM UTC (11:00 PM Pacific Time / early morning city update)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  daily_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase python-dotenv

      - name: Execute Autonomous 24h Fire Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python run_daily_pipeline.py --days 1

      - name: Upload Daily Opportunities CSV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Fire-Violations-24h
          path: |
            LA_Daily_Fire_Violations_24h.csv
            exports/
          if-no-files-found: ignore
