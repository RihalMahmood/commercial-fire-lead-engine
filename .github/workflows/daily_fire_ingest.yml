name: California Fire Safety Autonomous Engine

on:
  schedule:
    # Run every 4 hours (at minute 0)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  ingest_and_process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase python-dotenv

      - name: Test Cloud Connectivity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python test_foundation.py

      # Subsequent stages will be plugged in here as we build each intent:
      # - name: Run Municipal SODA Extraction (Intent 1 & 2)
      #   run: python extract_municipal_violations.py
      # - name: Run Phase 1 & 2 AI Processing
      #   run: python process_leads_ai.py
